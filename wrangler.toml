name = "qq-chat-worker"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# 绑定 KV 用于保存每个 user 的对话上下文
# 下方 id 必须是真实存在的 KV 命名空间 id（Cloudflare 部署按钮不会自动创建，需手动填）：
#   npx wrangler kv:namespace create "CHAT_HISTORY"
#   把返回的 id 填到下面（作者本人已填好；第三方部署请换成自己的 id）
[[kv_namespaces]]
binding = "CHAT_HISTORY"
id = "c471f322cd0a4fb5aa7213d40a5e45d3"
